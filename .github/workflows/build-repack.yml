      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "$env:GITHUB_WORKSPACE\$env:ROOT\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\AzerothCore-PlayerBots-Repack-Windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzerothCore-PlayerBots-Repack-Windows-x64
